<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeOS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 400px;
      background: #0a0a0f;
      color: #f0f0f5;
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 13px;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      font-size: 24px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
    }

    .header p {
      font-size: 11px;
      opacity: 0.8;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px;
    }

    .stat-box {
      background: #1a1a2e;
      border: 1px solid #2a2a40;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
    }

    .stat-label {
      font-size: 10px;
      color: #8888a0;
      margin-top: 2px;
    }

    .green {
      color: #22c55e;
    }

    .red {
      color: #ef4444;
    }

    .blue {
      color: #3b82f6;
    }

    .purple {
      color: #a855f7;
    }

    .yellow {
      color: #eab308;
    }

    .section {
      padding: 0 12px 12px;
    }

    .section h3 {
      font-size: 11px;
      color: #8888a0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .current-site {
      background: #1a1a2e;
      border: 1px solid #2a2a40;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .site-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .site-dot.productive {
      background: #22c55e;
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.3);
    }

    .site-dot.distraction {
      background: #ef4444;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.3);
    }

    .site-dot.neutral {
      background: #eab308;
      box-shadow: 0 0 6px rgba(234, 179, 8, 0.3);
    }

    .site-info {
      flex: 1;
      min-width: 0;
    }

    .site-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-time {
      font-size: 11px;
      color: #8888a0;
    }

    /* Focus Session Styles */
    .focus-panel {
      margin: 0 12px 12px;
      background: #1a1a2e;
      border: 1px solid #2a2a40;
      border-radius: 10px;
      padding: 12px;
    }

    .focus-panel.active {
      border-color: rgba(59, 130, 246, 0.5);
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(139, 92, 246, 0.08));
    }

    .focus-panel h3 {
      font-size: 11px;
      color: #8888a0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .focus-select {
      width: 100%;
      padding: 8px;
      background: #0a0a12;
      color: #f0f0f5;
      border: 1px solid #2a2a40;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .focus-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .focus-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .focus-btn-start {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
    }

    .focus-btn-start:hover {
      transform: translateY(-1px);
    }

    .focus-btn-stop {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .focus-timer {
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      color: #3b82f6;
      font-variant-numeric: tabular-nums;
      margin: 8px 0;
    }

    .focus-meta {
      text-align: center;
      font-size: 11px;
      color: #8888a0;
    }

    .focus-stats-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
      font-size: 11px;
    }

    .focus-stat {
      text-align: center;
    }

    .focus-stat .val {
      font-weight: 700;
      font-size: 14px;
    }

    .streak-bar {
      background: #1a1a2e;
      border: 1px solid #2a2a40;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 12px 12px;
    }

    .streak-fire {
      font-size: 20px;
    }

    .streak-count {
      font-size: 18px;
      font-weight: 800;
    }

    .streak-label {
      font-size: 11px;
      color: #8888a0;
    }

    .footer {
      padding: 12px;
      border-top: 1px solid #2a2a40;
    }

    .open-dashboard {
      display: block;
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .open-dashboard:hover {
      transform: translateY(-1px);
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      color: #8888a0;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #12121a;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      transition: width 0.5s ease;
    }

    .level-info {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #8888a0;
      margin-top: 4px;
    }

    .workspace-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 6px;
    }

    .workspace-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>

<body>
  <div class="header">
    <span class="header-icon">⚡</span>
    <div>
      <h1>LifeOS</h1>
      <p>Your Productivity OS</p>
    </div>
  </div>

  <div id="content">
    <div class="loading">Loading...</div>
  </div>

  <div id="focus-section"></div>

  <div class="footer">
    <button class="open-dashboard" id="openDashboard">Open Dashboard</button>
  </div>

  <script src="popup.js"></script>
</body>

</html>
