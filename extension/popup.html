<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeOS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 340px;
      min-height: 440px;
      background: #0a0a0f;
      color: #f0f0f5;
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-size: 13px;
      overflow-x: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      font-size: 22px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 700;
    }

    .header p {
      font-size: 10px;
      opacity: 0.8;
      margin-top: 1px;
    }

    .streak-pill {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 4px 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 700;
    }

    .streak-pill .fire {
      font-size: 14px;
    }

    /* Main content padding */
    .content-wrap {
      padding: 10px;
    }

    /* Score Row: Donut + Stats */
    .score-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1a1a2e;
      border: 1px solid #2a2a40;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .mini-donut {
      position: relative;
      width: 68px;
      height: 68px;
      flex-shrink: 0;
    }

    .mini-donut svg {
      transform: rotate(-90deg);
      width: 68px;
      height: 68px;
    }

    .mini-donut .center-label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .mini-donut .score-num {
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
    }

    .mini-donut .score-sub {
      font-size: 8px;
      color: #8888a0;
      margin-top: 1px;
    }

    .stats-col {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .mini-stat {
      text-align: center;
      padding: 6px 4px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
    }

    .mini-stat .val {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.1;
    }

    .mini-stat .lbl {
      font-size: 9px;
      color: #8888a0;
      margin-top: 2px;
    }

    .green {
      color: #22c55e;
    }

    .red {
      color: #ef4444;
    }

    .blue {
      color: #3b82f6;
    }

    .purple {
      color: #a855f7;
    }

    .yellow {
      color: #eab308;
    }

    .orange {
      color: #f97316;
    }

    /* Level XP bar */
    .xp-bar-wrap {
      margin-bottom: 10px;
      background: #1a1a2e;
      border: 1px solid #2a2a40;
      border-radius: 10px;
      padding: 8px 12px;
    }

    .xp-bar-header {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #8888a0;
      margin-bottom: 4px;
    }

    .xp-bar {
      width: 100%;
      height: 5px;
      background: #12121a;
      border-radius: 3px;
      overflow: hidden;
    }

    .xp-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      transition: width 0.5s ease;
    }

    /* Currently Tracking */
    .section-header {
      font-size: 10px;
      color: #8888a0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      padding: 0 2px;
    }

    .tracking-card {
      background: #1a1a2e;
      border: 1px solid #2a2a40;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    .tracking-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .cat-dot.productive {
      background: #22c55e;
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.4);
    }

    .cat-dot.distraction {
      background: #ef4444;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.4);
    }

    .cat-dot.neutral {
      background: #eab308;
      box-shadow: 0 0 6px rgba(234, 179, 8, 0.4);
    }

    .tracking-info {
      flex: 1;
      min-width: 0;
    }

    .tracking-domain {
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tracking-title {
      font-size: 11px;
      color: #8888a0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tracking-time {
      font-size: 14px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #667eea;
      flex-shrink: 0;
    }

    .workspace-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 600;
      margin-top: 4px;
    }

    .workspace-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* Top Sites */
    .top-sites {
      background: #1a1a2e;
      border: 1px solid #2a2a40;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    .site-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }

    .site-row+.site-row {
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .site-rank {
      font-size: 9px;
      font-weight: 700;
      color: #555570;
      width: 14px;
      text-align: center;
    }

    .site-domain {
      flex: 1;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-time {
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #8888a0;
    }

    /* Focus Session Styles */
    .focus-panel {
      background: #1a1a2e;
      border: 1px solid #2a2a40;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .focus-panel.active {
      border-color: rgba(59, 130, 246, 0.5);
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(139, 92, 246, 0.08));
    }

    .focus-panel h3 {
      font-size: 10px;
      color: #8888a0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .focus-select {
      width: 100%;
      padding: 7px 8px;
      background: #0a0a12;
      color: #f0f0f5;
      border: 1px solid #2a2a40;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .focus-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .focus-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .focus-btn-start {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
    }

    .focus-btn-start:hover {
      transform: translateY(-1px);
    }

    .focus-btn-stop {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .focus-timer {
      font-size: 32px;
      font-weight: 900;
      text-align: center;
      color: #3b82f6;
      font-variant-numeric: tabular-nums;
      margin: 6px 0;
      letter-spacing: 2px;
    }

    .focus-meta {
      text-align: center;
      font-size: 11px;
      color: #8888a0;
    }

    .focus-stats-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 6px;
      font-size: 11px;
    }

    .focus-stat {
      text-align: center;
    }

    .focus-stat .val {
      font-weight: 700;
      font-size: 14px;
    }

    /* Footer */
    .footer {
      padding: 10px;
      border-top: 1px solid #2a2a40;
    }

    .open-dashboard {
      display: block;
      width: 100%;
      padding: 9px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .open-dashboard:hover {
      transform: translateY(-1px);
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      color: #8888a0;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="header-left">
      <span class="header-icon">⚡</span>
      <div>
        <h1>LifeOS</h1>
        <p>Context Engine Active</p>
      </div>
    </div>
    <div class="streak-pill" id="streak-pill">
      <span class="fire">💤</span>
      <span id="streak-count">0</span>
    </div>
  </div>

  <div class="content-wrap" id="content">
    <div class="loading">Loading...</div>
  </div>

  <div id="focus-section"></div>

  <div class="footer">
    <button class="open-dashboard" id="openDashboard">Open Dashboard</button>
    <div id="voice-permission-row" style="margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <button id="enableVoiceBtn" style="width: 100%; padding: 7px; background: rgba(249,115,22,0.12); border: 1px solid rgba(249,115,22,0.3); border-radius: 8px; color: #fb923c; font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
        Enable Voice (Cmd+Shift+Space)
      </button>
    </div>
  </div>

  <script src="server-config.js"></script>
  <script src="popup.js"></script>
</body>

</html>
