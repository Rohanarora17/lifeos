<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>LifeOS Sidebar</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a0c;
            /* Match LifeOS dark theme */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .error-state {
            display: none;
            color: #888;
            font-family: system-ui, sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        .error-state.visible {
            display: block;
        }
    </style>
</head>

<body>

    <div id="error-screen" class="error-state">
        <div style="font-size: 32px; margin-bottom: 20px;">⚠️</div>
        <h2 style="color: #ff6e27; margin: 0 0 10px 0; font-size: 16px;">LifeOS Not Reachable</h2>
        <p style="font-size: 13px; line-height: 1.5;">Please ensure the LifeOS Next.js server is running on
            <br><code id="expected-url">http://100.99.194.80:3000</code>.
        </p>
    </div>

    <iframe id="lifeos-frame" src=""></iframe>

    <script src="server-config.js"></script>
    <script src="sidebar.js"></script>
</body>

</html>
