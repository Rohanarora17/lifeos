<!DOCTYPE html>
<html>

<head>
    <title>LifeOS Tracker Settings</title>
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            padding: 20px;
            width: 300px;
        }

        h2 {
            font-size: 16px;
            margin-top: 0;
        }

        .group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background: #000;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover {
            background: #333;
        }

        #status {
            margin-top: 10px;
            font-size: 13px;
            color: green;
            display: none;
        }
    </style>
</head>

<body>
    <h2>LifeOS Tracker Settings</h2>

    <div class="group">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="sk_lifeos_..." />
        <p style="font-size: 11px; color: #666;">This key allows the extension to write to your local LifeOS database.
        </p>
    </div>

    <div class="group">
        <label for="apiUrl">Server URL (API Base)</label>
        <input type="url" id="apiUrl" placeholder="http://localhost:3000/api" />
        <p style="font-size: 11px; color: #666;">Use your Mac Mini's IP if hosting remotely (e.g.,
            http://192.168.1.50:3000/api).</p>
    </div>

    <div class="group">
        <label for="deviceName">Device Name</label>
        <input type="text" id="deviceName" placeholder="e.g. MacBook or Mac Mini" />
        <p style="font-size: 11px; color: #666;">Identifier sent to your LifeOS server to distinguish web traffic across
            different computers.</p>
    </div>

    <button id="saveBtn">Save Settings</button>
    <div id="status">Settings saved.</div>

    <script src="options.js"></script>
</body>

</html>
