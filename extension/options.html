<!DOCTYPE html>
<html>
<head>
    <title>LifeOS Tracker Settings</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; padding: 20px; width: 300px; }
        h2 { font-size: 16px; margin-top: 0; }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 13px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #000; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 500; }
        button:hover { background: #333; }
        #status { margin-top: 10px; font-size: 13px; color: green; display: none; }
    </style>
</head>
<body>
    <h2>LifeOS Tracker Settings</h2>
    
    <div class="group">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="sk_lifeos_..." />
        <p style="font-size: 11px; color: #666;">This key allows the extension to write to your local LifeOS database.</p>
    </div>

    <button id="saveBtn">Save Settings</button>
    <div id="status">Settings saved.</div>

    <script src="options.js"></script>
</body>
</html>
