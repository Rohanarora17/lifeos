name: Deploy to Mac Mini

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect via Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.MAC_MINI_HOST }}
          username: ${{ secrets.MAC_MINI_USER }}
          key: ${{ secrets.MAC_MINI_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            # Ensure node/npm are on PATH (Homebrew Apple Silicon + Intel, nvm)
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"

            set -e
            cd ~/lifeos
            # Use HTTPS with token to avoid SSH key requirement on Mac Mini
            REPO_URL=$(git remote get-url origin | sed 's|git@github.com:|https://github.com/|' | sed 's|\.git$||')
            git pull "https://x-access-token:${GH_TOKEN}@${REPO_URL#https://}" main
            npm ci --prefer-offline
            rm -rf .next
            npm run build
            launchctl unload ~/Library/LaunchAgents/com.lifeos.server.plist
            launchctl load  ~/Library/LaunchAgents/com.lifeos.server.plist
            launchctl unload ~/Library/LaunchAgents/com.lifeos.daemon.plist
            launchctl load  ~/Library/LaunchAgents/com.lifeos.daemon.plist
