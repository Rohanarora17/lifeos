name: Deploy to Mac Mini

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:unit
      - run: node scripts/guardian-audit-harness.cjs
      - run: node --check extension/background.js
      - run: node --check extension/offscreen.js
      - run: npm run build

  package-collectors:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build versioned MacBook collectors
        run: |
          swift build --package-path macos/LifeOSCopilot -c release
          mkdir -p collector-artifacts
          BIN_DIR="$(swift build --package-path macos/LifeOSCopilot -c release --show-bin-path)"
          cp "${BIN_DIR}/LifeOSCopilot" collector-artifacts/LifeOSCopilot-0.3.0
          ditto -c -k --keepParent extension collector-artifacts/LifeOS-Tracker-1.3.0.zip
          shasum -a 256 collector-artifacts/* > collector-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-macbook-collectors-${{ github.sha }}
          path: collector-artifacts/
          retention-days: 30

  deploy:
    needs: [verify, package-collectors]
    runs-on: ubuntu-latest
    steps:
      - name: Connect via Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_ENV: ${{ secrets.APP_ENV }}
          DEPLOY_COMMIT: ${{ github.sha }}
        with:
          host: ${{ secrets.MAC_MINI_HOST }}
          username: ${{ secrets.MAC_MINI_USER }}
          key: ${{ secrets.MAC_MINI_SSH_KEY }}
          envs: GH_TOKEN,APP_ENV,DEPLOY_COMMIT
          script: |
            # Ensure node/npm are on PATH (Homebrew Apple Silicon + Intel, nvm)
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"

            set -e
            cd ~/lifeos
            # Deploy the exact commit that passed the verify job.
            REPO_URL=$(git remote get-url origin | sed 's|git@github.com:|https://github.com/|' | sed 's|\.git$||')
            git fetch "https://x-access-token:${GH_TOKEN}@${REPO_URL#https://}" "${DEPLOY_COMMIT}"
            git checkout --detach "${DEPLOY_COMMIT}"

            SECURITY_ENV="$HOME/.config/lifeos/security.env"
            RUNTIME_ENV="$HOME/.config/lifeos/runtime.env"
            NEXT_ENV=$(mktemp)
            printf '%s\n' "${APP_ENV}" > "${NEXT_ENV}"

            if [ -f "${SECURITY_ENV}" ]; then
              grep -E '^(LIFEOS_AUTH_MODE|LIFEOS_API_TOKEN|LIFEOS_ADMIN_REAUTH_TOKEN|LIFEOS_DEVICE_TOKEN|LIFEOS_ALLOWED_ORIGINS|LIFEOS_EXTENSION_ID|LIFEOS_COOKIE_SECURE)=.+' \
                "${SECURITY_ENV}" >> "${NEXT_ENV}"
            elif [ -f .env.local ]; then
              grep -E '^(LIFEOS_AUTH_MODE|LIFEOS_API_TOKEN|LIFEOS_ADMIN_REAUTH_TOKEN|LIFEOS_DEVICE_TOKEN|LIFEOS_ALLOWED_ORIGINS|LIFEOS_EXTENSION_ID|LIFEOS_COOKIE_SECURE)=.+' \
                .env.local >> "${NEXT_ENV}"
            fi

            if [ -f "${RUNTIME_ENV}" ]; then
              grep -E '^[A-Za-z_][A-Za-z0-9_]*=.+' "${RUNTIME_ENV}" >> "${NEXT_ENV}"
            fi

            for key in \
              LIFEOS_AUTH_MODE \
              LIFEOS_API_TOKEN \
              LIFEOS_ADMIN_REAUTH_TOKEN \
              LIFEOS_DEVICE_TOKEN \
              LIFEOS_ALLOWED_ORIGINS \
              LIFEOS_EXTENSION_ID
            do
              grep -q -E "^${key}=.+" "${NEXT_ENV}" || {
                echo "Required production security variable is missing: ${key}"
                rm -f "${NEXT_ENV}"
                exit 1
              }
            done

            chmod 600 "${NEXT_ENV}"
            mv "${NEXT_ENV}" .env.local
            printf '\nLIFEOS_DEPLOYED_COMMIT=%s\n' "${DEPLOY_COMMIT}" >> .env.local
            npm ci --prefer-offline

            mkdir -p backups
            if [ -f data/lifeos.db ]; then
              sqlite3 data/lifeos.db ".backup 'backups/lifeos-before-${DEPLOY_COMMIT}.db'"
            fi

            node scripts/rotate-logs.cjs
            npm run build

            for service in server daemon guardian-voice whisper; do
              plist="$HOME/Library/LaunchAgents/com.lifeos.${service}.plist"
              if [ -f "$plist" ]; then
                launchctl unload "$plist" 2>/dev/null || true
                launchctl load "$plist"
              fi
            done

            API_TOKEN="$(sed -n 's/^LIFEOS_API_TOKEN=//p' .env.local | tail -1 | tr -d '\"' | tr -d "'")"
            curl --fail --silent --retry 10 --retry-connrefused --retry-delay 2 \
              -H "Authorization: Bearer ${API_TOKEN}" \
              http://127.0.0.1:3000/api/diagnostics >/dev/null
